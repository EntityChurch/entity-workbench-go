# Canonical docs manifest for entity-workbench-go.
#
# Declares the *publishable* canonical doc surface so the content leaf can
# ingest these instead of hand-authoring prose about them.
#
# READ THIS BEFORE REMOVING A LINE: this file is a KEEP-LIST, so an omission is
# an act of DELETION against anything already public. "Absence is the honest
# default" is true only of a document that has never published. Everything else
# under docs/ that is not named here (dated status snapshots, handoffs,
# outbound packets, design notes) is ephemeral and is scrubbed by the release
# builder's path/name patterns — intentionally not listed.
#
# Schema mirrors docs/release-readiness/CANONICAL-DOCS-FORMAT.md (meta).
# Paths are repo-relative (resolved against this manifest's location).

[project]
name   = "Entity Workbench (Go)"
slug   = "entity-workbench-go"
repo   = "entity-workbench-go"
github = "https://github.com/EntityChurch/entity-workbench-go"
intro  = """
Entity Workbench (Go) is a reference application built on the Entity Core
Protocol — it sits at the bindings/apps layer of the ecosystem, above the Go
reference implementation (entity-core-go) and below nothing: nothing else
depends on it. It exists to show one coherent way to build an entity-native
application: a CLI (entity-shell), a TUI (entity-console), a desktop GUI
(Avalonia), a Go SDK (entitysdk) over the kernel, and a small CDN-corridor
toolset (entity-publish / entity-vcs / entity-fetch).

It is a *reference paradigm, not a mandate*. The protocol does not require any
of these shapes; the workbench is an opinionated demonstration, and the
documents below are the disciplines and patterns that demonstration holds
itself to — offered as a worked example, not a standard to conform to.
"""

# ---------------------------------------------------------------------------
# AREAS — what each directory IS, so a check does not have to guess.
#
# Declared 2026-09-17 on the ecosystem doc standard. The default rules carry
# one idea of where docs live — dated docs belong under a path segment named
# `status` — and this repo keeps two directories that are dated BY DESIGN and
# are not status: the outbound packet corpus and its archive. Declaring them is
# how a correct layout stops reading as a few hundred violations.
# ---------------------------------------------------------------------------

[[area]]
path      = "docs/status"
kind      = "status"          # dated, episodic, ages out
publishes = false

[[area]]
path      = "docs/outbox"
kind      = "outbox"          # routing — packets we have SENT. NEVER published.
publishes = false

[[area]]
path      = "docs/archive/outbox"
kind      = "archive"         # dated BY DESIGN; does not age out
publishes = false

[[area]]
path      = "docs/agents/memory"
kind      = "memory"          # the accumulated findings, by topic
publishes = true

[[area]]
path      = "docs/architecture"
kind      = "reference"       # undated / living — edited in place
publishes = true

# ---------------------------------------------------------------------------
# LIVING — durable files, edited in place, that would otherwise read as stale
# dated docs. `internal = true` is the case that had no honest answer before:
# a counterpart tracker is durable AND must never publish, and the only way to
# silence the staleness check used to be to declare it canonical — which
# publishes it.
# ---------------------------------------------------------------------------

[[living]]
glob     = "docs/status/TRACKER-*.md"
internal = true               # durable, edited in place, and NOT published

[[living]]
path = "docs/STATUS.md"       # declared canonical below; this says it is not a dated snapshot


# ---------------------------------------------------------------------------
# Root documents — the standard eight, declared 2026-08-24.
#
# WHY THESE ARE HERE AT ALL: this manifest is a KEEP-LIST, so a document it
# does not name is dropped from what this project publishes. Seven of these
# were already published and this file did not name them — so leaving them out
# would not have "kept them back", it would have REMOVED them, SECURITY.md and
# its vulnerability-reporting address included. An omission here is an act of
# deletion against anything already public, which is why the list is reviewed
# against what is published and not only against what is in the tree.
#
# METHODOLOGY.md is not currently published here; declaring it is joining the
# convention the rest of the ecosystem follows, not closing a gap.
#
# This is the AP42 corollary with the polarity flipped: declaring a doc is part
# of shipping it, and a keep-list that omits a document the repo already
# published does not "keep it out", it TAKES IT AWAY.
# ---------------------------------------------------------------------------

